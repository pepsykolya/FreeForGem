# FreeForGemPear — see LICENSE
[package]
name = "freeforgem"
version = "1.7.3"
edition = "2024"
license-file = "../LICENSE"
description = "FreeForGem: Pearl (PRL), Common Foundry (CMFD) and NOID (Parano1d) GPU miner"

[dependencies]
# Official Pearl crates (ISC), pinned to the upstream commit the miner was verified against
zk-pow = { git = "https://github.com/pearl-research-labs/pearl", rev = "2f8b770cac8f8b74be05c1fc51c2baeb76ce0701" }
pearl-blake3 = { git = "https://github.com/pearl-research-labs/pearl", rev = "2f8b770cac8f8b74be05c1fc51c2baeb76ce0701", features = ["serde"] }
blake3 = { version = "1.8", features = ["rayon"] }
primitive-types = "0.12.1"
anyhow = "1"
serde_json = "1"
base64 = "0.21"
bincode = "1.3.3"
flate2 = "1"
rand = "0.9"
ctrlc = { version = "3", features = ["termination"] }
socket2 = { version = "0.5", features = ["all"] }
sha2 = "0.10"   # CMFD self-test: SHA-256 of the official test vector output
# NOID (Parano1d): official Poseidon2b crate (Apache-2.0), pinned to the commit the GPU kernels were verified against
# (v2.0.x; the PoW code is unchanged in v2.1.0); host-side CPU check of every hit, self-test and tuning reference
noid_poseidon2b = { git = "https://git.parano1d.org/ignotusnemo/parano1d", rev = "5302b3f303f1b26e0a6a3de6f6d15aad7b3161ea" }
noid_core = { git = "https://git.parano1d.org/ignotusnemo/parano1d", rev = "5302b3f303f1b26e0a6a3de6f6d15aad7b3161ea" }
# NOID pools speak stratum over TLS (stratum+ssl://)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

[profile.release]
opt-level = 3
debug = false
